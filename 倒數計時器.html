<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的數字倒數計時器</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 450px;
            margin: 50px auto;
            background-color: #34495e;
            padding: 30px;
            border-radius: 15px;
            border: 3px solid #3498db;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
        }
        h1 {
            color: #3498db;
            margin-bottom: 20px;
        }
        /* 時間顯示大字體 */
        .time-display {
            font-size: 64px;
            font-weight: bold;
            color: #1abc9c;
            background-color: #1a252f;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            letter-spacing: 2px;
            border: 1px solid #7f8c8d;
        }
        /* 輸入框區塊 */
        .input-group {
            margin-bottom: 25px;
            font-size: 18px;
        }
        input {
            width: 60px;
            padding: 8px;
            font-size: 18px;
            border-radius: 5px;
            border: 1px solid #ccc;
            text-align: center;
            background-color: #ecf0f1;
            color: #2c3e50;
        }
        /* 控制按鈕 */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            color: white;
            transition: 0.2s;
        }
        button.start { background-color: #2ecc71; }
        button.start:hover { background-color: #27ae60; }
        button.pause { background-color: #f39c12; }
        button.pause:hover { background-color: #d35400; }
        button.reset { background-color: #e74c3c; }
        button.reset { background-color: #c0392b; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⏱️ 數字倒數計時器</h1>
        
        <!-- 大時間顯示幕 -->
        <div class="time-display" id="timerScreen">05:00</div>

        <!-- 設定時間輸入框 -->
        <div class="input-group">
            <input type="number" id="inputMin" value="5" min="0" max="99"> 分 
            <input type="number" id="inputSec" value="0" min="0" max="59"> 秒
        </div>

        <!-- 操作按鈕 -->
        <div class="btn-group">
            <button class="start" id="startBtn" onclick="startTimer()">▶️ 開始</button>
            <button class="pause" onclick="pauseTimer()">⏸️ 暫停</button>
            <button class="reset" onclick="resetTimer()">🔄 重設</button>
        </div>
    </div>

    <script>
        let countdownInterval = null;
        let totalSeconds = 300; // 預設 5 分鐘 (5 * 60)
        let isRunning = false;

        // 瀏覽器內建音效產生器（不需要額外載入音樂檔案，絕對不會卡死）
        let audioCtx = null;
        function playAlarmSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                // 叮咚勝利音效
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15); // E5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) { console.log(e); }
        }

        // 更新畫面上的時間格式 (例如把 5 變成 05)
        function updateScreen() {
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            
            let displayMin = minutes < 10 ? "0" + minutes : minutes;
            let displaySec = seconds < 10 ? "0" + seconds : seconds;
            
            document.getElementById('timerScreen').innerText = displayMin + ":" + displaySec;
        }

        // 按下【開始】
        function startTimer() {
            if (isRunning) return; // 如果已經在跑了，就不要重複觸發

            // 如果是剛重設完，讀取輸入框的新時間
            if (countdownInterval === null) {
                let min = parseInt(document.getElementById('inputMin').value) || 0;
                let sec = parseInt(document.getElementById('inputSec').value) || 0;
                totalSeconds = (min * 60) + sec;
                
                if (totalSeconds <= 0) {
                    alert("請先輸入大於 0 秒的時間喔！");
                    return;
                }
            }

            isRunning = true;
            updateScreen();

            // 每隔 1 秒減少 1 秒
            countdownInterval = setInterval(() => {
                totalSeconds--;
                updateScreen();

                if (totalSeconds <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    isRunning = false;
                    playAlarmSound(); // 播放警示音
                    document.getElementById('timerScreen').innerText = "🎉 時間到！";
                }
            }, 1000);
        }

        // 按下【暫停】
        function pauseTimer() {
            clearInterval(countdownInterval);
            isRunning = false;
        }

        // 按下【重設】
        function resetTimer() {
            clearInterval(countdownInterval);
            countdownInterval = null;
            isRunning = false;
            
            let min = parseInt(document.getElementById('inputMin').value) || 0;
            let sec = parseInt(document.getElementById('inputSec').value) || 0;
            totalSeconds = (min * 60) + sec;
            
            updateScreen();
        }
    </script>
</body>
</html>
